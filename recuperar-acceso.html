<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar acceso · LLDB</title>
  <link rel="stylesheet" href="/assets/recuperar-acceso.css">
  <script src="/assets/recuperar-acceso.js" defer></script>
</head>
<body>
  <main>
    <a href="/#inicio" aria-label="Lluvia de Bendición, ir a Inicio"><img src="/assets/logo-oficial-definitivo.png" alt="" width="80" height="80"></a>
    <h1>Recuperar acceso al Panel Maestro</h1>
    <form hidden>
      <p>Elige una nueva contraseña de al menos 15 caracteres.</p>
      <label>Nueva contraseña <input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></label>
      <button type="submit">Guardar contraseña</button>
    </form>
    <p id="recovery-result" role="status"></p>
    <p><a href="/#inicio">Ir a Inicio</a></p>
  </main>
