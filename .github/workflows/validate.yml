name: LLDB Launch Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LLDB launch invariants
        shell: python
        run: |
          from pathlib import Path
          import json, re
          html=Path("index.html").read_text(encoding="utf-8")
          assert html.count("<main")==1 and html.count("</main>")==1
          assert 'name="description"' in html
          assert 'name="application-name" content="LLDB"' in html
          assert 'rel="canonical" href="https://lluviadebendicion.com/"' in html
          assert 'property="og:url" content="https://lluviadebendicion.com/"' in html
          assert 'property="og:image" content="/assets/logo-oficial-lldb.jpg"' in html
          assert 'name="twitter:image" content="/assets/logo-oficial-lldb.jpg"' in html
          assert len(re.findall(r"data-scene=",html))==12
          home=html.split('<section id="inicio"',1)[1].split("</section>",1)[0]
          assert "radio-stage" not in home
          assert "/assets/logo-oficial-lldb.jpg" in html
          assert "/assets/logo-marketing-redondo.jpg" not in html
          assert "Estás entrando en sintonía de esta tu emisora Lluvia de Bendición .Com, porque queremos que el Señor llueva en ti." in html
          assert not re.search(r"purple|#800080|#6a0dad",html,re.I)
          assert not re.search(r"rainbow|arcoíris",html,re.I)
          for p in Path("api").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          vercel=json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          assert vercel["cleanUrls"] is True
          assert any(x.get("source")=="/sw.js" for x in vercel["headers"])
          manifest=json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["short_name"]=="LLDB"
          assert manifest["start_url"]=="/#inicio"
          assert manifest["icons"][0]["src"]=="/assets/logo-oficial-lldb.jpg"
          assert "logo-marketing-redondo" not in json.dumps(manifest)
          print("LLDB launch validation passed")
