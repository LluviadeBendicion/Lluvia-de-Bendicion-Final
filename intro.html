<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLDB Intro V3 - Prueba</title><style>html,body{margin:0;height:100%;background:#020916;color:white;overflow:hidden;font-family:Georgia,serif}main{position:relative;height:100dvh;background:radial-gradient(ellipse at 50% 0,#304962,#071528 55%,#02040a)}.cloud{position:absolute;inset:-15% -20% 55%;background:radial-gradient(ellipse,#4c6079 0%,#1d3048 45%,transparent 70%);filter:blur(25px);animation:move 8s ease-in-out infinite alternate}.rain{position:absolute;inset:0;overflow:hidden}.drop{position:absolute;width:3px;height:13px;border-radius:60% 60% 70% 70%;background:linear-gradient(#c5edff00,#b5dffa);animation:fall linear infinite}.bolt{position:absolute;inset:0;opacity:0;filter:drop-shadow(0 0 15px #ffcb4b)}.bolt svg{height:75%;width:100%}.splash{position:absolute;left:50%;top:68%;width:2px;height:2px;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 50px 20px #ffd067;opacity:0}.logo{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;text-align:center;width:min(82vw,530px);aspect-ratio:1;border:9px ridge #c99737;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 12%,#d8a644,#102c50 35%,#030b1c 76%);box-shadow:0 0 40px #d8a644aa}.logo b{font-size:clamp(22px,5vw,52px);color:#ffda8b;text-shadow:1px 2px 6px black}.logo small{margin-top:18px;color:#f6dfaa}.caption{position:absolute;bottom:15%;width:100%;text-align:center;opacity:0;font-size:clamp(15px,3vw,23px)}.controls{position:absolute;bottom:20px;width:100%;text-align:center}button{padding:10px 20px;background:#132139;border:1px solid #d9b66e;border-radius:22px;color:#ffe1a1}.note{position:absolute;top:12px;left:15px;font:11px Arial;color:#fff9}.play .bolt{animation:strike 1.3s 3s both}.play .splash{animation:impact 2s 3.7s both}.play .logo{animation:reveal 3s 4s forwards}.play .caption{animation:revealText 3s 5s forwards}@keyframes move{to{transform:translateX(8%)}}@keyframes fall{to{transform:translateY(115vh)}}@keyframes strike{0%,18%,30%,100%{opacity:0}19%,24%{opacity:1}31%,43%{opacity:1}}@keyframes impact{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(20)}}@keyframes reveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes revealText{to{opacity:1}}</style><main id="scene" class="play"><div class="cloud"></div><div class="rain" id="rain"></div><div class="bolt"><svg viewBox="0 0 600 700"><path d="M360 0 310 160 365 220 280 365 335 400 255 535 310 460 275 400 355 315 305 265 345 190 320 145Z" fill="#fff3b5" stroke="#ffc54a" stroke-width="7"/><path d="M355 315 445 290 405 345 465 375" fill="none" stroke="#ffe6a2" stroke-width="6"/></svg></div><div class="splash"></div><div class="logo"><b>Lluvia de<br>Bendición.Com</b><small>Porque queremos que el Señor llueva en ti</small></div><div class="caption">🎙️ Ever: «Bienvenido a tu plataforma cristiana, Lluvia de Bendición punto com»</div><div class="note">PRUEBA DE ANIMACIÓN · LOGO OFICIAL Y AUDIO PENDIENTES</div><div class="controls"><button onclick="replay()">↻ Repetir</button></div></main><script>const rain=document.getElementById('rain');for(let i=0;i<130;i++){const d=document.createElement('i');d.className='drop';d.style.left=Math.random()*100+'%';d.style.top=-Math.random()*100+'%';d.style.animationDuration=(.7+Math.random()*.9)+'s';d.style.animationDelay=-Math.random()*3+'s';rain.appendChild(d)}function replay(){const s=document.getElementById('scene');s.classList.remove('play');void s.offsetWidth;s.classList.add('play')}</script></html>
